apiVersion: gateway-policy.databricks.com/v1
kind: GatewayPolicyBundle
metadata:
  name: ml-platform-gateway-policies
  owner: platform-team@example.com
  managedBy: gateway-policy

spec:
  account:
    accountId: "00000000-0000-0000-0000-000000000000"
    profile: DEFAULT

  workspaces:
    - name: production
      profile: prod
      host: https://adb-0000000000000000.0.azuredatabricks.net

  budgets:
  - name: ai-gateway-account-ceiling
    displayName: "AI Gateway account ceiling"
    resourceType: unity_ai_gateway
    workspaces: []  # empty = all workspaces in account scope
  - name: ai-gateway-ml-platform
    displayName: "AI Gateway ML platform"
    resourceType: unity_ai_gateway
    workspaces:
      - production
    tags:
      team: ml-platform
    sharedThresholds:
      - amountUsd: 50000
        emails:
          - finops@example.com
          - ml-platform-leads@example.com
    perUserThreshold:
      amountUsd: 2000
      emails:
        - ml-platform-leads@example.com

  - name: genie-code-sandbox
    displayName: "Genie Code sandbox"
    resourceType: genie
    workspaces:
      - production
    tags:
      databricks-product: genie
    sharedThresholds:
      - amountUsd: 5000
        emails:
          - finops@example.com
        blockUsage: true
    perUserThreshold:
      amountUsd: 100
      emails:
        - genie-admins@example.com
      blockUsage: true
    perUserOverrides:
      - principals:
          - "group:genie-power-users"
        amountUsd: 300
        blockUsage: true

  rateLimits:
  - name: chatbot-prod-endpoint-cap
    workspace: production
    endpoint: catalog.schema.chatbot-prod
    fallbackEnabled: true  # availability fallback on destination 429/5xx; not a cost router
    limits:
      - scope: endpoint
        qpm: 500
        tpm: 500000
      - scope: user
        principal: alice@example.com
        qpm: 120
        tpm: 200000
      - scope: group
        principal: ml-research
        qpm: 200
        tpm: 400000

  governors:
  - name: ml-platform-monthly-burn
    workspace: production
    rateLimitPolicy: chatbot-prod-endpoint-cap
    sqlWarehouseId: "a1b2c3d4e5f6g7h8"
    forecastEndpoint: gateway-spend-forecast
    monthlyTargetUsd: 25000
    lookbackDays: 7
    forecastHorizonDays: 30
    pollingIntervalSeconds: 300
    cooldownSeconds: 1800
    hysteresisPct: 5
    modelPrices:
      - model: databricks-meta-llama-3-3-70b-instruct
        inputUsdPerMillionTokens: 0.50
        outputUsdPerMillionTokens: 1.50
      - model: databricks-claude-sonnet-4
        inputUsdPerMillionTokens: 3.00
        outputUsdPerMillionTokens: 15.00
    stages:
      - name: caution
        forecastUtilizationPct: 70
        qpmMultiplier: 0.75
        tpmMultiplier: 0.75
        fallbackEnabled: true
      - name: throttle
        forecastUtilizationPct: 85
        qpmMultiplier: 0.5
        tpmMultiplier: 0.5
      - name: emergency
        forecastUtilizationPct: 100
        qpmMultiplier: 0.1
        tpmMultiplier: 0.1
        blockProxyTraffic: true
        emergencyAllowlist:
          - platform-oncall@example.com

  sessionBudgets:
  - name: agent-sandbox-session
    workspace: production
    endpoint: catalog.schema.chatbot-prod
    upstreamBaseUrl: https://adb-0000000000000000.0.azuredatabricks.net/serving-endpoints/catalog.schema.chatbot-prod
    maxUsd: 25
    maxTotalTokens: 500000
    timeoutSeconds: 3600
    allowedIdentities:
      - agent-runtime@example.com
    allowedProjects:
      - ml-platform
    allowedRequestTagKeys:
      - project
      - team
    failMode: fail_closed
    modelPrices:
      - model: databricks-meta-llama-3-3-70b-instruct
        inputUsdPerMillionTokens: 0.50
        outputUsdPerMillionTokens: 1.50
      - model: databricks-claude-sonnet-4
        inputUsdPerMillionTokens: 3.00
        outputUsdPerMillionTokens: 15.00

  omnigent:
    sessionCostBudget:
      askThresholdsUsd: [5, 8]
      maxCostUsd: 10
      expensiveModels:
        - opus
        - gpt-5
    userDailyCostBudget:
      askThresholdsUsd: [25, 40]
      maxCostUsd: 50
      expensiveModels:
        - opus
        - gpt-5
